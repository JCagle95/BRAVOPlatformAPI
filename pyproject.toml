[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bravo-client"  # Must be unique on PyPI
version = "0.1.0"
authors = [
  { name="Jackson Cagle", email="jackson.cagle@neurology.ufl.edu" },
]
description = "The Python API Toolkit for interacting with the Brain Recording Analysis and Visualization Online (BRAVO) Platform"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.28.0",
]

[project.urls]
"Homepage" = "https://github.com/Fixel-Institute/BRAVO"
"Bug Tracker" = "https://github.com/Fixel-Institute/BRAVO/issues"